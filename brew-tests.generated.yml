tests:

  # wheatbeer   difficulty 1   cook 8m   age 2y Birch   alcohol 5
  # brewed exactly as the recipe asks
  - name: "wheatbeer / perfect"
    recipe: "wheatbeer"
    expect:
      recipe: "wheatbeer"
      quality: 10
      defects: []
      distillRuns: 0
      alcohol: 5
      ageTime: 2
      wood: "BIRCH"

  # the longest cook that still matches
  - name: "wheatbeer / cook-longest"
    recipe: "wheatbeer"
    cook: 16
    expect:
      recipe: "wheatbeer"
      quality: 8
      worstDefect: "CookTimeMismatch{16/8}"

  # one minute over that, so it no longer matches
  - name: "wheatbeer / cook-too-long"
    recipe: "wheatbeer"
    cook: 17
    expect:
      notRecipe: "wheatbeer"

  # one item short of the first ingredient
  - name: "wheatbeer / count-one-under"
    recipe: "wheatbeer"
    ingredients: [wheat/2]
    expect:
      recipe: "wheatbeer"
      quality: 10

  # one item too many of the first ingredient
  - name: "wheatbeer / count-one-over"
    recipe: "wheatbeer"
    ingredients: [wheat/4]
    expect:
      recipe: "wheatbeer"
      quality: 10

  # the most of the first ingredient that still matches
  - name: "wheatbeer / count-limit"
    recipe: "wheatbeer"
    ingredients: [wheat/11]
    expect:
      recipe: "beer"
      quality: 9

  # one item past that, so it no longer matches
  - name: "wheatbeer / count-beyond-limit"
    recipe: "wheatbeer"
    ingredients: [wheat/12]
    expect:
      notRecipe: "wheatbeer"

  # an ingredient the recipe needs is not in the pot
  - name: "wheatbeer / ingredient-missing"
    recipe: "wheatbeer"
    ingredients: [DIRT/1]
    expect:
      notRecipe: "wheatbeer"

  # distilled though the recipe never asked for it
  - name: "wheatbeer / distill-unwanted"
    recipe: "wheatbeer"
    distill: 1
    age: []
    expect:
      quality: "0..9"

  # left in the barrel half a tolerance too long
  - name: "wheatbeer / age-over"
    recipe: "wheatbeer"
    age:
      - { wood: BIRCH, years: 12 }
    expect:
      recipe: "wheatbeer"
      quality: 9
      ageTime: 12

  # left in so long the age factor bottoms out
  - name: "wheatbeer / age-beyond"
    recipe: "wheatbeer"
    age:
      - { wood: BIRCH, years: 23 }
    expect:
      recipe: "wheatbeer"
      quality: 7
      ageTime: 23

  # never barrelled, though the recipe wants it
  - name: "wheatbeer / age-none"
    recipe: "wheatbeer"
    age: []
    expect:
      ageTime: 0
      notRecipe: "wheatbeer"

  # aged in the wood next to the one it wants
  - name: "wheatbeer / wood-neighbour"
    recipe: "wheatbeer"
    age:
      - { wood: OAK, years: 2 }
    expect:
      recipe: "wheatbeer"
      quality: 10
      wood: "OAK"

  # aged in the wood furthest from the one it wants
  - name: "wheatbeer / wood-worst"
    recipe: "wheatbeer"
    age:
      - { wood: PALE_OAK, years: 2 }
    expect:
      recipe: "beer"
      quality: 9
      wood: "PALE_OAK"


