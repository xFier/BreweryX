# =====================================================================================
#  BreweryX brew tests                             run them with:   gradlew brewTest
#
#  To check every recipe at once you don't need this file: run  gradlew brewReport
#
#  This file is for the few things you want to pin down yourself -- "brewing this
#  should give that". It's yours to edit and isn't tracked by git. Delete it and run
#  brewTest again to get these examples back.
# =====================================================================================
#
#  Each test says what to brew, then what should come out under `expect:`.
#
#  What to brew
#    recipe        Start from a recipe. Anything you don't list below is taken from it.
#    ingredients   Like recipes.yml:  [WHEAT/3, SUGAR/2]
#    cook          Minutes in the cauldron.
#    distill       Times through the still. 0 means never.
#    age           A barrel:  {wood: OAK, years: 6}.  A list of these moves the brew
#                  between barrels.  `age: []` means never barrelled.
#
#  What should come out (list only what you care about)
#    recipe        The drink it should be.
#    quality       0 to 10, or a range like 8..10
#    alcohol       A number, or a range.
#
#  Also available: notRecipe, cauldronRecipe, wood, ageTime, distillRuns, effects,
#  outcome (OK, DISTILL_RUINED or AGE_RUINED). A misspelt key is reported with a
#  suggestion, so it is safe to experiment.
#
#  To brew against your server's recipes instead of BreweryX's defaults:
#    gradlew brewTest -PbreweryConfig=C:/path/to/server/plugins/BreweryX

tests:

  - name: Wheatbeer brewed to its recipe
    recipe: wheatbeer
    expect:
      recipe: wheatbeer
      quality: 10

  - name: One wheat too many is still a good wheatbeer
    recipe: wheatbeer
    ingredients: [WHEAT/4]
    expect:
      recipe: wheatbeer
      quality: 8..10

  - name: Distilling a wheatbeer ruins it
    ingredients: [WHEAT/3]
    cook: 8
    distill: 3
    expect:
      outcome: DISTILL_RUINED
      quality: 0
